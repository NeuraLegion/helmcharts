apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: fider-static-otp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: fider-static-otp
    spec:
      containers:
        - name: postgres
          image: postgres:{{ .Values.images.postgres }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.user | quote }}
                - -d
                - {{ .Values.postgres.db | quote }}
            initialDelaySeconds: 5
            periodSeconds: 10

        - name: smtp
          image: {{ .Values.images.mailhog }}
          ports:
            - containerPort: 8025
            - containerPort: 1025
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8025
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8025
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10

        - name: fider
          image: "{{ .Values.images.fiderRepository }}:{{ .Values.images.fider }}"
          ports:
            - containerPort: 3000
          env:
            - name: BASE_URL
              value: "https://{{ .Values.ingress.url }}"
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@localhost:5432/{{ .Values.postgres.db }}?sslmode=disable"
            - name: JWT_SECRET
              value: {{ .Values.fider.jwtSecret | quote }}
            - name: EMAIL_NOREPLY
              value: {{ .Values.fider.emailNoreply | quote }}
            - name: EMAIL_SMTP_HOST
              value: "localhost"
            - name: EMAIL_SMTP_PORT
              value: "1025"
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            failureThreshold: 18
            periodSeconds: 10

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
